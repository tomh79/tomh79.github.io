<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanisch Vokabeltrainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .progress {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .question-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .japanese-word {
            font-size: 3em;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .quiz-mode {
            display: inline-block;
            padding: 5px 15px;
            background: #ffc107;
            color: #333;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .options {
            display: grid;
            gap: 15px;
        }
        
        .option-btn {
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        
        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }
        
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            animation: correctPulse 0.5s;
        }
        
        .option-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            animation: wrongShake 0.5s;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .result-box {
            text-align: center;
            display: none;
        }
        
        .result-box h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .score {
            font-size: 2em;
            color: #28a745;
            margin-bottom: 30px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .completion-message {
            background: #d4edda;
            border: 2px solid #28a745;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .completion-message h3 {
            color: #28a745;
            margin-bottom: 10px;
        }
        
        .review-notice {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .review-notice h3 {
            color: #856404;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

        // LocalStorage Keys
        const STORAGE_KEY = 'japaneseQuizProgress';
        
        // Globale Variablen
        let unlearnedVocab = [];
        let learnedVocab = [];
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let wrongAnswers = [];
        let answered = false;
        let isReviewMode = false;

        // Progress laden oder initialisieren
        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                learnedVocab = data.learned || [];
                unlearnedVocab = allVocab.filter(v => 
                    !learnedVocab.some(l => l.jp === v.jp)
                );
            } else {
                unlearnedVocab = [...allVocab];
                learnedVocab = [];
            }
            updateStats();
        }

        // Progress speichern
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                learned: learnedVocab
            }));
        }

        // Statistiken aktualisieren
        function updateStats() {
            document.getElementById('learned-count').textContent = learnedVocab.length;
            document.getElementById('remaining-count').textContent = unlearnedVocab.length;
            document.getElementById('total-vocab').textContent = allVocab.length;
        }

        // Quiz initialisieren
        function initQuiz(reviewMode = false) {
            isReviewMode = reviewMode;
            currentQuestionIndex = 0;
            score = 0;
            
            if (reviewMode) {
                // Review-Modus: Nur falsche Antworten
                currentQuestions = [...wrongAnswers];
                wrongAnswers = []; // Reset für neue falsche Antworten im Review
                document.getElementById('quiz-mode').textContent = 'Wiederholung';
                document.getElementById('quiz-mode').style.background = '#dc3545';
                document.getElementById('quiz-mode').style.color = 'white';
            } else {
                // Normaler Modus: 20 ungelernte Wörter
                wrongAnswers = []; // Reset
                const count = Math.min(20, unlearnedVocab.length);
                currentQuestions = unlearnedVocab.slice(0, count);
                document.getElementById('quiz-mode').textContent = 'Hauptquiz';
                document.getElementById('quiz-mode').style.background = '#ffc107';
                document.getElementById('quiz-mode').style.color = '#333';
            }
            
            document.getElementById('quiz-box').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            
            showQuestion();
        }

        // Frage anzeigen
        function showQuestion() {
            answered = false;
            const question = currentQuestions[currentQuestionIndex];
            
            document.getElementById('current').textContent = currentQuestionIndex + 1;
            document.getElementById('total').textContent = currentQuestions.length;
            document.getElementById('japanese-word').textContent = question.jp;
            
            // 4 Antwortmöglichkeiten generieren
            const options = generateOptions(question);
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, question.en, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // Antwortmöglichkeiten generieren
        function generateOptions(correctQuestion) {
            const options = [correctQuestion.en];
            const otherVocab = allVocab.filter(v => v.en !== correctQuestion.en);
            
            while (options.length < 4) {
                const random = otherVocab[Math.floor(Math.random() * otherVocab.length)];
                if (!options.includes(random.en)) {
                    options.push(random.en);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }

        // Antwort überprüfen
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            answered = true;
            
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            
            const currentWord = currentQuestions[currentQuestionIndex];
            
            if (selected === correct) {
                btn.classList.add('correct');
                score++;
                
                // Im Hauptquiz: Als gelernt markieren
                if (!isReviewMode) {
                    if (!learnedVocab.some(v => v.jp === currentWord.jp)) {
                        learnedVocab.push(currentWord);
                        unlearnedVocab = unlearnedVocab.filter(v => v.jp !== currentWord.jp);
                        saveProgress();
                        updateStats();
                    }
                }
            } else {
                btn.classList.add('wrong');
                
                // Falsche Antwort speichern
                if (!wrongAnswers.some(v => v.jp === currentWord.jp)) {
                    wrongAnswers.push(currentWord);
                }
                
                // Im Hauptquiz: Zurück zu ungelernt
                if (!isReviewMode) {
                    learnedVocab = learnedVocab.filter(v => v.jp !== currentWord.jp);
                    if (!unlearnedVocab.some(v => v.jp === currentWord.jp)) {
                        unlearnedVocab.push(currentWord);
                    }
                    saveProgress();
                    updateStats();
                }
                
                // Richtige Antwort hervorheben
                allBtns.forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.add('correct');
                    }
                });
            }
            
            // Automatisch zur nächsten Frage nach 1 Sekunde
            setTimeout(() => {
                currentQuestionIndex++;
                
                if (currentQuestionIndex < currentQuestions.length) {
                    showQuestion();
                } else {
                    // Prüfen ob Review-Modus gestartet werden soll
                    if (!isReviewMode && wrongAnswers.length > 0) {
                        // Automatisch Review-Modus starten
                        setTimeout(() => {
                            initQuiz(true);
                        }, 1000);
                    } else {
                        // Ergebnisse anzeigen
                        showResults();
                    }
                }
            }, 1000);
        }

        // Ergebnisse anzeigen
        function showResults() {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            
            // Gesamtscore berechnen (Hauptquiz + Review)
            const totalQuestions = currentQuestions.length;
            document.getElementById('score').textContent = score;
            document.getElementById('total-questions').textContent = totalQuestions;
            
            // Completion Status
            const completionDiv = document.getElementById('completion-status');
            
            if (wrongAnswers.length === 0 && isReviewMode) {
                // Review perfekt abgeschlossen
                completionDiv.innerHTML = `
                    <div class="completion-message">
                        <h3>🎊 Perfekt!</h3>
                        <p>Du hast alle Wiederholungen gemeistert!</p>
                    </div>
                `;
            } else if (unlearnedVocab.length === 0 && !isReviewMode) {
                // Alle Vokabeln durchgearbeitet
                completionDiv.innerHTML = `
                    <div class="completion-message">
                        <h3>🎊 Glückwunsch!</h3>
                        <p>Du hast alle ${allVocab.length} Vokabeln durchgearbeitet!</p>
                    </div>
                `;
            } else {
                completionDiv.innerHTML = '';
            }
            
            // Button-Text anpassen
            const restartBtn = document.querySelector('.restart-btn');
            if (unlearnedVocab.length === 0) {
                restartBtn.textContent = 'Alles nochmal von vorne';
            } else {
                restartBtn.textContent = 'Nächste Runde';
            }
        }

        // Neue Runde starten
        function startNewRound() {
            if (unlearnedVocab.length === 0) {
                // Progress zurücksetzen wenn alles gelernt
                unlearnedVocab = [...allVocab];
                learnedVocab = [];
                saveProgress();
                updateStats();
            }
            initQuiz(false);
        }

        // Beim Laden initialisieren
        loadProgress();
        initQuiz(false);
    </script>
</body>
</html>
