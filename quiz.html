<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanisch Vokabeltrainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .progress {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .question-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .japanese-word {
            font-size: 3em;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .options {
            display: grid;
            gap: 15px;
        }
        
        .option-btn {
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        
        .option-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }
        
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
        }
        
        .next-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }
        
        .next-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .result-box {
            text-align: center;
            display: none;
        }
        
        .result-box h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .score {
            font-size: 2em;
            color: #28a745;
            margin-bottom: 30px;
        }
        
        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: #5568d3;
        }
        
        .wrong-answers {
            margin-top: 30px;
            text-align: left;
        }
        
        .wrong-answers h3 {
            color: #dc3545;
            margin-bottom: 15px;
        }
        
        .wrong-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }
        
        .wrong-item .jp {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .wrong-item .en {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇯🇵 Japanisch Vokabeltrainer</h1>
        
        <div id="quiz-box">
            <div class="progress">
                Frage <span id="current">1</span> von <span id="total">20</span>
            </div>
            
            <div class="question-box">
                <div class="japanese-word" id="japanese-word"></div>
            </div>
            
            <div class="options" id="options"></div>
            
            <button class="next-btn" id="next-btn">Weiter</button>
        </div>
        
        <div class="result-box" id="result-box">
            <h2>Quiz beendet! 🎉</h2>
            <div class="score">
                <span id="score">0</span> / <span id="total-questions">20</span> richtig
            </div>
            <button class="restart-btn" onclick="location.reload()">Neues Quiz starten</button>
            
            <div class="wrong-answers" id="wrong-answers"></div>
        </div>
    </div>

            { jp: "無駄/むだ", en: "waste" },
            { jp: "お湯/おゆ", en: "hot water" },
            { jp: "押入れ/おしいれ", en: "closet" },
            { jp: "お菓子/おかし", en: "sweets" },
            { jp: "市役所/しやくしょ", en: "city hall" },
            { jp: "自動販売機/じどうはんばいき", en: "vending machine" },
            { jp: "釣り/つり", en: "fishing" },
            { jp: "背/せ", en: "back" },
            { jp: "台/だい", en: "stand" },
            { jp: "お釣り/おつり", en: "change (money)" },
            { jp: "段々/だんだん", en: "gradually" }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let wrongAnswers = [];
        let answered = false;

        // Quiz initialisieren
        function initQuiz() {
            // 20 zufällige Vokabeln auswählen
            currentQuestions = getRandomQuestions(20);
            currentQuestionIndex = 0;
            score = 0;
            wrongAnswers = [];
            showQuestion();
        }

        // Zufällige Fragen auswählen
        function getRandomQuestions(count) {
            const shuffled = [...allVocab].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // Frage anzeigen
        function showQuestion() {
            answered = false;
            const question = currentQuestions[currentQuestionIndex];
            
            document.getElementById('current').textContent = currentQuestionIndex + 1;
            document.getElementById('total').textContent = currentQuestions.length;
            document.getElementById('japanese-word').textContent = question.jp;
            
            // 4 Antwortmöglichkeiten generieren
            const options = generateOptions(question);
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, question.en, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').style.display = 'none';
        }

        // Antwortmöglichkeiten generieren
        function generateOptions(correctQuestion) {
            const options = [correctQuestion.en];
            const otherVocab = allVocab.filter(v => v.en !== correctQuestion.en);
            
            while (options.length < 4) {
                const random = otherVocab[Math.floor(Math.random() * otherVocab.length)];
                if (!options.includes(random.en)) {
                    options.push(random.en);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }

        // Antwort überprüfen
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            answered = true;
            
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            
            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                wrongAnswers.push(currentQuestions[currentQuestionIndex]);
                
                // Richtige Antwort hervorheben
                allBtns.forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.add('correct');
                    }
                });
            }
            
            document.getElementById('next-btn').style.display = 'block';
        }

        // Nächste Frage
        document.getElementById('next-btn').addEventListener('click', () => {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        });

        // Ergebnisse anzeigen
        function showResults() {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
            
            document.getElementById('score').textContent = score;
            document.getElementById('total-questions').textContent = currentQuestions.length;
            
            // Falsche Antworten anzeigen
            if (wrongAnswers.length > 0) {
                const wrongContainer = document.getElementById('wrong-answers');
                wrongContainer.innerHTML = '<h3>Falsche Antworten zum Wiederholen:</h3>';
                
                wrongAnswers.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'wrong-item';
                    div.innerHTML = `
                        <div class="jp">${item.jp}</div>
                        <div class="en">✓ ${item.en}</div>
                    `;
                    wrongContainer.appendChild(div);
                });
            }
        }

        // Quiz starten
        initQuiz();
    </script>
